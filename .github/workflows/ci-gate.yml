# CI-T-b (DEVOS-152, docs/modules/CI-T-b.md, docs/decisions/0017-ci-gate.md): one always-running check that
# passes only when every other PR check on the head SHA passed. The `main` ruleset requires this one check
# (DEVOS-143), so a path-filtered or skipped job can never leave a PR silently mergeable (C2).
name: ci-gate
on:
  pull_request:
    branches: [main]
concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: read
jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The gate's own code comes from the base branch, so a PR cannot change the rule that judges it. The
      # PR head supplies only the workflow files (they define which checks this PR runs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          sparse-checkout: |
            .github/workflows
            scripts/ci
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: base/.nvmrc
      - name: Install the gate's one dependency (yaml, pinned by the base lockfile)
        working-directory: base
        run: pnpm install --frozen-lockfile --filter . --ignore-scripts
      - name: Wait for every PR check on the head SHA
        timeout-minutes: 28
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_BASE: ${{ github.event.pull_request.base.ref }}
          GATE_WORKFLOWS_DIR: ${{ github.workspace }}/head/.github/workflows
        working-directory: base
        # Bootstrap only: until main has the gate (the PR that adds it), the head's copy runs.
        run: |
          if [ -f scripts/ci/ci-gate.mjs ]; then node scripts/ci/ci-gate.mjs
          else echo "ci-gate: bootstrap, base has no gate yet; running the head copy"; cp ../head/scripts/ci/ci-gate.mjs scripts/ci-gate-bootstrap.mjs && node scripts/ci-gate-bootstrap.mjs; fi
