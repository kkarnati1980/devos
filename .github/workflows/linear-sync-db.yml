# M2.6 — Linear sync store against a real Postgres 17 through the M1.1 Prisma client (docs/modules/M2.6.md).
name: linear-sync-db
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: linear-sync-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linear-sync-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # DEVOS-139 G3: p95 under 4 min on 12 Nov; the ceiling only stops a hung job
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devos
          POSTGRES_PASSWORD: devos_ci_only
          POSTGRES_DB: devos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devos" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway database in the job's service container; not a real credential.
      DATABASE_URL: postgresql://devos:devos_ci_only@localhost:5432/devos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @devos/db exec prisma migrate deploy
      - name: Build the db client
        run: pnpm --filter @devos/db run build
      - name: AT1-AT3 and AT9 against Postgres
        run: pnpm --filter @devos/linear-sync run test:db
