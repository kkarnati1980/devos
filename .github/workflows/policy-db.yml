# M1.7 — policy engine against a real Postgres 17 through the M1.1 Prisma client (docs/modules/M1.7.md).
name: policy-db
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: policy-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # DEVOS-139 G3: p95 under 4 min on 12 Nov; the ceiling only stops a hung job
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devos
          POSTGRES_PASSWORD: devos_ci_only
          POSTGRES_DB: devos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devos" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway database in the job's service container; not a real credential.
      DATABASE_URL: postgresql://devos:devos_ci_only@localhost:5432/devos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @devos/db exec prisma migrate deploy
      - name: Build the db client
        run: pnpm --filter @devos/db run build
      - name: AT4, AT6-AT8 against Postgres
        run: pnpm --filter @devos/policy run test:db
