name: contract-check
# DEVOS-142 (gate integrity Part 2). Contract: docs/modules/GI-2.md.
# Every module contract added or changed in the PR must carry a program-checkable "## Pass rule".
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contract-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pass-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pass rule in changed contracts
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/contracts/check-pass-rule.mjs --base "$BASE" --head "$HEAD"
