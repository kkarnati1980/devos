# M1.3 — dashboard browser acceptance tests (XSS never executes under the CSP; 390×844 layout; < 2 s) in Chromium (docs/modules/M1.3.md).
name: dashboard-e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: dashboard-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium (version pinned by the playwright devDependency)
        timeout-minutes: 5
        run: pnpm --filter @devos/dashboard exec playwright install chromium
      # DEVOS-98: the runner's apt mirrors intermittently fail DNS ("Temporary failure resolving").
      # apt-get install is idempotent, so the system packages are retried: 4 tries, 30/60/90 s apart.
      - name: Install Chromium system packages (bounded retry)
        timeout-minutes: 12
        run: |
          for i in 1 2 3 4; do
            if pnpm --filter @devos/dashboard exec playwright install-deps chromium; then exit 0; fi
            if [ "$i" -lt 4 ]; then echo "::warning::install-deps try $i failed; retrying in $((i * 30)) s"; sleep $((i * 30)); fi
          done
          echo "::error::install-deps failed after 4 tries"
          exit 1
      - name: Browser acceptance tests
        run: pnpm --filter @devos/dashboard run test:e2e
