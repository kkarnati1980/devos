# M1.3 — dashboard browser acceptance tests (XSS never executes under the CSP; 390×844 layout; < 2 s) in Chromium (docs/modules/M1.3.md).
name: dashboard-e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: dashboard-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dashboard-e2e:
    # Pinned (DEVOS-99): on the ubuntu-26.04 image behind ubuntu-latest, apt in `playwright install --with-deps`
    # failed to resolve the Ubuntu archives on most runs (11 Nov 2026). 24.04 is a Playwright-supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # DEVOS-98: room for the bounded package-install retry
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium (version pinned by the playwright devDependency)
        # No apt (DEVOS-99): the ubuntu-24.04 runner image already ships the shared libraries Chromium needs
        # (it has Google Chrome preinstalled), and apt was the step failing to resolve the Ubuntu archives.
        # Only the browser download is retried (idempotent); a missing library still fails the tests below.
        timeout-minutes: 9
        run: |
          for i in 1 2 3; do
            timeout 150 pnpm --filter @devos/dashboard exec playwright install chromium && exit 0
            echo "browser download failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      # DEVOS-98: the runner's apt mirrors intermittently fail DNS ("Temporary failure resolving"), for
      # 15+ minutes at a time. The ubuntu-latest image already carries most browser libraries, so the
      # package install is best effort (2 tries, idempotent, so safe to retry) and the next step is the
      # hard check: Chromium must launch, or the job fails. The tests themselves are unchanged.
      - name: Install Chromium system packages (best effort, bounded retry)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for i in 1 2; do
            if pnpm --filter @devos/dashboard exec playwright install-deps chromium; then exit 0; fi
            if [ "$i" -lt 2 ]; then echo "::warning::install-deps try $i failed; retrying in 30 s"; sleep 30; fi
          done
          echo "::warning::install-deps failed twice; relying on the runner image's libraries (checked next)"
          exit 1
      - name: Check Chromium launches
        timeout-minutes: 2
        working-directory: apps/dashboard
        run: node -e "import('playwright').then(async ({ chromium }) => { const b = await chromium.launch(); await b.close(); console.log('chromium-launch-ok'); })"
      - name: Browser acceptance tests
        run: pnpm --filter @devos/dashboard run test:e2e
