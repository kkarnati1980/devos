# M1.3 — dashboard browser acceptance tests (XSS never executes under the CSP; 390×844 layout; < 2 s) in Chromium (docs/modules/M1.3.md).
name: dashboard-e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: dashboard-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dashboard-e2e:
    # Pinned (DEVOS-99): on the ubuntu-26.04 image behind ubuntu-latest, apt in `playwright install --with-deps`
    # failed to resolve the Ubuntu archives on most runs (11 Nov 2026). 24.04 is a Playwright-supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium (version pinned by the playwright devDependency)
        # Retried (safe: the install is idempotent) up to 3 times, so a transient mirror or DNS failure is not a red PR.
        run: |
          for i in 1 2 3; do
            pnpm --filter @devos/dashboard exec playwright install --with-deps chromium && exit 0
            echo "browser install failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Browser acceptance tests
        run: pnpm --filter @devos/dashboard run test:e2e
