# R1 AT1–AT3 (docs/modules/R1.md): every image builds from a clean checkout and the compose stack boots.
# All values below are CI-only throwaways generated per run; no real credential is used or stored.
name: release-images
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: deploy/compose.yaml
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway configuration (masked)
        run: |
          set -euo pipefail
          gen() { openssl rand -hex "$1"; }
          for n in DEVOS_SESSION_KEY:32 DEVOS_POLICY_HMAC_KEY:32; do
            v="$(gen "${n#*:}")"; echo "::add-mask::$v"; echo "${n%%:*}=$v" >> "$GITHUB_ENV"
          done
          # PR20-r1: the Postgres password carries URL-reserved characters, so the smoke test proves
          # with-db-url.mjs encodes them (a raw interpolation would break migrate and the api).
          v="$(gen 16)#/@:%?&"; echo "::add-mask::$v"; echo "POSTGRES_PASSWORD=$v" >> "$GITHUB_ENV"
          # DEVOS-81: the M1.4 vault key is now required (base64 of 32 random bytes).
          v="$(openssl rand -base64 32)"; echo "::add-mask::$v"; echo "DEVOS_VAULT_KEY=$v" >> "$GITHUB_ENV"
          # R3-a: a throwaway self-signed pair for 127.0.0.1 stands in for `tailscale cert`, so the smoke
          # test runs the api and the dashboard over verified HTTPS with secure cookies on, as on the server.
          mkdir -p "$RUNNER_TEMP/tls" && touch "$RUNNER_TEMP/tailscaled.sock"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/tls/ci.key" -out "$RUNNER_TEMP/tls/ci.crt" 2>/dev/null
          chmod 644 "$RUNNER_TEMP/tls/ci.key" "$RUNNER_TEMP/tls/ci.crt"   # readable by the container user (uid 1000)
          {
            echo "DEVOS_KK_LOGIN=ci@example.com"
            echo "DEVOS_ALLOWED_ORIGINS=https://127.0.0.1:3000"
            echo "DEVOS_API_ORIGIN=https://127.0.0.1:3001"
            echo "DEVOS_COOKIE_SECURE=1"
            echo "DEVOS_TLS_CERT_FILE=/certs/ci.crt"
            echo "DEVOS_TLS_KEY_FILE=/certs/ci.key"
            echo "CI_CA=$RUNNER_TEMP/tls/ci.crt"
            # PR20-r2: email on with only host and sender, so the api must start on its SMTP defaults
            # (port and security unset). Nothing is sent during the smoke test.
            echo "DEVOS_SMTP_HOST=smtp.example.com"
            echo "DEVOS_SMTP_FROM=devos@example.com"
            echo "DEVOS_TLS_DIR=$RUNNER_TEMP/tls"
            echo "DEVOS_TAILSCALE_SOCKET_HOST=$RUNNER_TEMP/tailscaled.sock"
          } >> "$GITHUB_ENV"
      - name: AT3 compose refuses to start without DEVOS_BIND_IP
        run: |
          if docker compose config -q 2>err.txt; then echo "compose accepted a missing DEVOS_BIND_IP"; exit 1; fi
          grep -q "DEVOS_BIND_IP is required" err.txt
      - name: AT3 (DEVOS-81) compose refuses to start without each server-required variable
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: |
          set -euo pipefail
          docker compose config -q   # everything set: accepted
          for v in DEVOS_POLICY_HMAC_KEY DEVOS_VAULT_KEY DEVOS_TLS_CERT_FILE DEVOS_TLS_KEY_FILE DEVOS_API_ORIGIN; do
            if env -u "$v" docker compose config -q 2>err.txt; then echo "compose accepted a missing $v"; exit 1; fi
            grep -q "$v is required" err.txt || { echo "no '$v is required' message"; exit 1; }
            # An empty value is refused too (:? also rejects empty), so a value Coolify blanked cannot slip through.
            if env "$v=" docker compose config -q 2>err.txt; then echo "compose accepted an empty $v"; exit 1; fi
            echo "$v: required (ok)"
          done
      - uses: ./.github/actions/security-tools
      - name: AT3 gitleaks over the rendered compose configuration (with a seeded negative control)
        run: |
          set -euo pipefail
          # Render with every variable set to a marker, so any finding is a literal written in the file.
          render() {
            env -i PATH="$PATH" HOME="$HOME" DEVOS_BIND_IP=127.0.0.1 POSTGRES_PASSWORD=set-in-coolify \
              DEVOS_KK_LOGIN=set-in-coolify DEVOS_SESSION_KEY=set-in-coolify DEVOS_ALLOWED_ORIGINS=https://set.in.coolify \
              DEVOS_POLICY_HMAC_KEY=set-in-coolify DEVOS_VAULT_KEY=set-in-coolify DEVOS_API_ORIGIN=https://set.in.coolify:3001 \
              DEVOS_TLS_CERT_FILE=/certs/set-in-coolify.crt DEVOS_TLS_KEY_FILE=/certs/set-in-coolify.key \
              "$@" docker compose -f deploy/compose.yaml config > "$out/compose.rendered.yaml"
          }
          scan() { gitleaks dir --no-banner --redact --exit-code 1 "$out" > /dev/null 2>&1; }
          out="$RUNNER_TEMP/rendered-clean"; mkdir -p "$out"; render env
          if ! scan; then echo "gitleaks found a secret in the rendered compose configuration"; exit 1; fi
          echo "rendered config: clean"
          # Negative control: a seeded token (built at run time) in the rendered config must be found.
          out="$RUNNER_TEMP/rendered-seeded"; mkdir -p "$out"
          seed="ghp_$(openssl rand -hex 18 | head -c 36)"; echo "::add-mask::$seed"
          render env DEVOS_SMTP_USER="$seed"
          if scan; then echo "negative control: gitleaks missed a seeded token"; exit 1; fi
          echo "negative control: seeded token detected (ok)"
      - name: AT1 build every image
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: docker compose build
      - name: AT2 boot the stack
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: docker compose up -d --wait --wait-timeout 240 api dashboard worker
      - name: AT2 migrate ran once and exited 0; health reports this SHA; ready; dashboard answers
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: |
          set -euo pipefail
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
          # R3-a: both services answer over HTTPS with the certificate verified (--cacert, never -k).
          health="$(curl -fsS --cacert "$CI_CA" --max-time 10 https://127.0.0.1:3001/health)"; echo "$health"
          test "$(jq -r .sha <<<"$health")" = "$GIT_SHA"
          test "$(curl -fsS --cacert "$CI_CA" --max-time 10 https://127.0.0.1:3001/ready | jq -r .status)" = "ready"
          if curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3001/health 2>/dev/null; then echo "the api answered plain HTTP"; exit 1; fi
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)")" = "healthy"
          code="$(curl -s --cacert "$CI_CA" -o /dev/null -w '%{http_code}' --max-time 20 https://127.0.0.1:3000/)"; echo "dashboard HTTP $code"
          [[ "$code" =~ ^(200|30[1278])$ ]]
          test "$(docker compose ps worker --format '{{.State}}')" = "running"
      - name: AT3 ports are bound to DEVOS_BIND_IP only; no secret in any image
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: |
          set -euo pipefail
          docker compose ps --format json | jq -c 'if type == "array" then .[] else . end | .Publishers // [] | .[] | select(.PublishedPort > 0)' | tee pubs.txt
          test -s pubs.txt
          if jq -e 'select(.URL != "127.0.0.1")' pubs.txt >/dev/null; then echo "a port is published beyond DEVOS_BIND_IP"; exit 1; fi
          for img in $(docker compose images -q | sort -u); do
            docker history --no-trunc "$img" > layers.txt; docker image inspect "$img" > inspect.txt
            for v in "$POSTGRES_PASSWORD" "$DEVOS_SESSION_KEY" "$DEVOS_POLICY_HMAC_KEY" "$DEVOS_VAULT_KEY"; do
              if grep -qF "$v" layers.txt inspect.txt; then echo "a secret value is baked into image $img"; exit 1; fi
            done
          done
      - name: R2 AT5 G1 server checks against the live stack (caps-saved, run-resume with a hard kill, receipt-chain)
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: |
          set -uo pipefail
          expect() { local want="$1"; shift; "$@"; local rc=$?; echo "-> exit $rc (want $want)"; [[ "$rc" == "$want" ]]; }
          c=scripts/server/checks
          expect 3 bash "$c/caps-saved.sh" || exit 1          # caps not confirmed yet (before H9)
          expect 3 bash "$c/receipt-chain.sh" || exit 1       # no receipt written yet
          if ! expect 0 bash "$c/run-resume.sh"; then        # probe run killed mid-run and resumed
            # Diagnostics (CI throwaway data only): the probe run's timeline and the queue job's state.
            q() { docker compose exec -T postgres psql -U devos -d devos -P pager=off -c "$1"; }
            q "select e.seq, e.ts, e.type, e.payload->>'state' as state, e.payload->>'turn' as turn from run_event e join run r on r.id = e.run_id where r.model = 'devos-g1-probe' order by e.seq"
            q "select c.seq, c.created_at, c.data->>'turn' as turn, c.data->'state'->'ending'->>'step' as ending_step from checkpoint c join run r on r.id = c.run_id where r.model = 'devos-g1-probe' order by c.seq"
            q "select type, message, retryable, created_at from run_error e join run r on r.id = e.run_id where r.model = 'devos-g1-probe'"
            q "select status, reserved_usd, actual_usd, created_at, updated_at from budget_reservation b join run r on r.id = b.run_id where r.model = 'devos-g1-probe'"
            for k in $(docker compose exec -T redis redis-cli --scan --pattern 'bull:devos-runs:*' | grep -v ':events$' | sort); do
              echo "== $k ($(docker compose exec -T redis redis-cli type "$k" | tr -d '\r'))"
              case "$(docker compose exec -T redis redis-cli type "$k" | tr -d '\r')" in
                hash) docker compose exec -T redis redis-cli hgetall "$k" | grep -v '^{"runId"' | head -40 ;;
                list) docker compose exec -T redis redis-cli lrange "$k" 0 -1 ;;
                zset) docker compose exec -T redis redis-cli zrange "$k" 0 -1 withscores ;;
                set) docker compose exec -T redis redis-cli smembers "$k" ;;
              esac
            done
            exit 1
          fi
          expect 0 bash "$c/receipt-chain.sh" || exit 1       # the probe's receipts verify
          docker compose exec -T postgres psql -U devos -d devos -v ON_ERROR_STOP=1 -qc \
            "insert into app_settings (singleton, caps_confirmed_at, updated_at) values (true, now(), now()) on conflict (singleton) do update set caps_confirmed_at = now()"
          expect 0 bash "$c/caps-saved.sh" || exit 1          # confirmed positive caps
          # (A zero cap cannot be stored: the M1.1 CHECK app_settings_values rejects it. The helper's
          # zero-cap failure is covered by packages/run-engine/test/g1.test.mjs AT3.)
          # Seeded failure: one changed receipt byte breaks the chain.
          docker compose exec -T postgres psql -U devos -d devos -v ON_ERROR_STOP=1 -qc \
            "alter table policy_decision disable trigger user; update policy_decision set bundle_hash = 'tampered' where seq = 1; alter table policy_decision enable trigger user"
          expect 1 bash "$c/receipt-chain.sh" || exit 1
      - name: Logs on failure (values are per-run throwaways and masked)
        if: failure()
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        env: { DEVOS_BIND_IP: 127.0.0.1 }
        run: docker compose down -v --remove-orphans
